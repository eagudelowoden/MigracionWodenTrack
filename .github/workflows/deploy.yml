name: Deploy WodenTrack V2

on:
  push:
    branches:
      - dagudelo/production
      - dagudelo/qa

jobs:
  # ─────────────────────────────────────────────
  # DESPLIEGUE A TEST/QA  (rama: dagudelo/qa)
  # ─────────────────────────────────────────────
  deploy-test:
    if: github.ref == 'refs/heads/dagudelo/qa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Correr pruebas unitarias del backend — si algo falla, el job para
      #    aqui mismo y NADA de lo de abajo se ejecuta (ni build ni copia ni
      #    reinicio). No se despliega codigo que no pasa sus propias pruebas.
      - name: Pruebas unitarias Backend
        run: |
          cd backend
          npm install
          npm test

      # 2. Compilar backend QA
      - name: Compilar Backend QA
        run: |
          cd backend
          npm run build:qa

      # 3. Compilar frontend QA
      #    frontend/.env.qa esta en .gitignore — el runner no lo tiene, hay
      #    que escribirlo desde un secret antes de compilar (igual que prod).
      - name: Escribir .env.qa del frontend
        run: echo "${{ secrets.FRONTEND_ENV_QA }}" > frontend/.env.qa

      - name: Compilar Frontend QA
        run: |
          cd frontend
          npm install
          npm run build:qa

      # 4. Detener PM2 ANTES de copiar: en Windows no se puede sobrescribir un
      #    archivo que el proceso viejo todavia tiene abierto (a diferencia de
      #    Linux). Si no se detiene primero, el tar de Windows (bsdtar) falla
      #    al extraer con "Refusing to overwrite archive" sobre el archivo que
      #    justo estaba bloqueado. Silenciar el error si el proceso no existe
      #    aun (primer despliegue).
      - name: Detener PM2 TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackTest';
            if ($p) { pm2 stop WodenTrackTest }"

      # 5. Copiar backend compilado al servidor
      - name: Copiar Backend dist a servidor TEST
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/dist/*"
          target: "C:/Users/Administrator/Documents/WodenTrackTest/dist"
          strip_components: 2

      # 5b. Copiar package.json/package-lock.json — npm install (paso 5c) los
      #     necesita para saber qué instalar. Van en la RAÍZ del servidor,
      #     junto a "dist", no adentro.
      - name: Copiar package.json a servidor TEST
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/package.json,backend/package-lock.json"
          target: "C:/Users/Administrator/Documents/WodenTrackTest"
          strip_components: 1

      # 5c. Instalar dependencias del backend en el servidor. El deploy solo
      #     copiaba dist/ — node_modules del servidor quedaba congelado desde
      #     la última vez que alguien corrió npm install a mano ahí, así que
      #     cualquier dependencia nueva agregada al repo (ej. app-info-parser)
      #     nunca llegaba sola y el proceso reventaba con MODULE_NOT_FOUND.
      - name: Instalar dependencias backend TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrackTest;
            npm install --omit=dev;
            if ($LASTEXITCODE -ne 0) { exit 1 }"

      # 6. Copiar frontend compilado al IIS
      - name: Copiar Frontend dist a IIS TEST
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "C:/inetpub/wwwroot/WodenTrackTest/dist"
          strip_components: 2

      # 7. Verificar esquema de base de datos ANTES de reiniciar el proceso.
      #    Si falla, los pasos 8 y 9 (reiniciar PM2, avisar) nunca se ejecutan.
      - name: Verificar esquema de base de datos TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrackTest;
            $env:NODE_ENV='qa';
            node dist\\scripts\\verify-schema.js;
            if ($LASTEXITCODE -ne 0) { exit 1 }"

      # 8. Reiniciar PM2 en el servidor (solo si el paso 7 pasó)
      #    Se fija NODE_ENV=qa explícitamente antes de "pm2 start" porque el
      #    arranque en frío no tenía forma de saber qué .env.* cargar.
      - name: Reiniciar PM2 TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackTest';
            if ($p) { pm2 restart WodenTrackTest --update-env }
            else { $env:NODE_ENV='qa'; pm2 start C:\\Users\\Administrator\\Documents\\WodenTrackTest\\dist\\main.js --name WodenTrackTest };
            pm2 save"

      # 9. Avisar por correo que el despliegue terminó bien — solo se llega
      #    aqui si TODO lo de arriba (pruebas, build, copia, esquema, PM2) pasó.
      - name: Notificar despliegue exitoso TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrackTest;
            $env:NODE_ENV='qa';
            node dist\\scripts\\notify-deploy.js"

  # ─────────────────────────────────────────────
  # DESPLIEGUE A PRODUCCION  (rama: dagudelo/production)
  # ─────────────────────────────────────────────
  deploy-prod:
    if: github.ref == 'refs/heads/dagudelo/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Correr pruebas unitarias del backend — si algo falla, el job para
      #    aqui mismo. No se despliega codigo que no pasa sus propias pruebas.
      - name: Pruebas unitarias Backend
        run: |
          cd backend
          npm install
          npm test

      # 2. Compilar backend PROD
      - name: Compilar Backend PROD
        run: |
          cd backend
          npm run build:prod

      # 3. Compilar frontend PROD
      #    Vite incrusta las VITE_* en el bundle en tiempo de compilacion (no
      #    en runtime), y .env.production del frontend esta en .gitignore, asi
      #    que el runner de GitHub no lo tiene — hay que escribirlo desde un
      #    secret antes de compilar, o VITE_API_URL queda undefined.
      - name: Escribir .env.production del frontend
        run: echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > frontend/.env.production

      - name: Compilar Frontend PROD
        run: |
          cd frontend
          npm install
          npm run build

      # 3b. Detener PM2 ANTES de copiar: en Windows no se puede sobrescribir un
      #     archivo que el proceso viejo todavia tiene abierto (a diferencia de
      #     Linux). Si no se detiene primero, el tar de Windows (bsdtar) falla
      #     al extraer con "Refusing to overwrite archive" sobre el archivo que
      #     justo estaba bloqueado — el mismo fix que ya tenia QA, aplicado
      #     aca tras el error real en el deploy de produccion.
      - name: Detener PM2 PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackPRD';
            if ($p) { pm2 stop WodenTrackPRD }"

      # 4. Copiar backend compilado al servidor
      #    OJO: la carpeta real en el servidor es WodenTrack_Prd (no WodenTrackV2).
      - name: Copiar Backend dist a servidor PROD
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/dist/*"
          target: "C:/Users/Administrator/Documents/WodenTrack_Prd/dist"
          strip_components: 2

      # 4b. Copiar package.json/package-lock.json — npm install (paso 4c) los
      #     necesita para saber qué instalar. Van en la RAÍZ del servidor,
      #     junto a "dist", no adentro.
      - name: Copiar package.json a servidor PROD
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/package.json,backend/package-lock.json"
          target: "C:/Users/Administrator/Documents/WodenTrack_Prd"
          strip_components: 1

      # 4c. Instalar dependencias del backend en el servidor. El deploy solo
      #     copiaba dist/ — node_modules del servidor quedaba congelado desde
      #     la última vez que alguien corrió npm install a mano ahí, así que
      #     cualquier dependencia nueva agregada al repo (ej. app-info-parser)
      #     nunca llegaba sola y el proceso reventaba con MODULE_NOT_FOUND.
      - name: Instalar dependencias backend PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrack_Prd;
            npm install --omit=dev;
            if ($LASTEXITCODE -ne 0) { exit 1 }"

      # 5. Copiar frontend compilado al IIS
      #    OJO: la carpeta real es WodenTrackPrd y los archivos van en la RAÍZ, QA
      #    (index.html/assets junto a web.config), sin subcarpeta "dist". QA
      - name: Copiar Frontend dist a IIS PROD
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "C:/inetpub/wwwroot/WodenTrackPrd"
          strip_components: 2

      # 6. Verificar esquema de base de datos ANTES de reiniciar el proceso. qa
      #    Si falta una tabla/columna, este paso termina en error y GitHub
      #    Actions NUNCA ejecuta los pasos 7 y 8 (reiniciar PM2, avisar) — el
      #    proceso viejo sigue corriendo tal cual, y llega un correo de alerta
      #    (MAIL_ALERT_TO) con el detalle de qué falta en la base de datos.
      - name: Verificar esquema de base de datos PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrack_Prd;
            $env:NODE_ENV='production';
            node dist\\scripts\\verify-schema.js;
            if ($LASTEXITCODE -ne 0) { exit 1 }"

      # 7. Reiniciar PM2 en el servidor (solo si el paso 6 pasó) -- PRUEBAS
      - name: Reiniciar PM2 PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackPRD';
            if ($p) { pm2 restart WodenTrackPRD --update-env }
            else { pm2 start C:\\Users\\Administrator\\Documents\\WodenTrack_Prd\\ecosystem.config.js };
            pm2 save"

      # 8. Avisar por correo que el despliegue terminó bien — solo se llega
      #    aqui si TODO lo de arriba (pruebas, build, copia, esquema, PM2) pasó.
      - name: Notificar despliegue exitoso PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrack_Prd;
            $env:NODE_ENV='production';
            node dist\\scripts\\notify-deploy.js"
