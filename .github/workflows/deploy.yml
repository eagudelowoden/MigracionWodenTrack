name: Deploy WodenTrack V2

on:
  push:
    branches:
      - dagudelo/production
      - test

jobs:
  # ─────────────────────────────────────────────
  # DESPLIEGUE A TEST  (rama: test)
  # ─────────────────────────────────────────────
  deploy-test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Compilar backend QA
      - name: Compilar Backend QA
        run: |
          cd backend
          npm install
          npm run build:qa

      # 2. Compilar frontend QA
      - name: Compilar Frontend QA
        run: |
          cd frontend
          npm install
          npm run build:qa

      # 3. Copiar backend compilado al servidor
      - name: Copiar Backend dist a servidor TEST
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/dist/*"
          target: "C:/Users/Administrator/Documents/WodenTrackTest/dist"
          strip_components: 2

      # 4. Copiar frontend compilado al IIS
      - name: Copiar Frontend dist a IIS TEST
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "C:/inetpub/wwwroot/WodenTrackTest/dist"
          strip_components: 2

      # 5. Reiniciar PM2 en el servidor
      - name: Reiniciar PM2 TEST
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackTest';
            if ($p) { pm2 restart WodenTrackTest --update-env }
            else { pm2 start C:\\Users\\Administrator\\Documents\\WodenTrackTest\\dist\\main.js --name WodenTrackTest };
            pm2 save"

  # ─────────────────────────────────────────────
  # DESPLIEGUE A PRODUCCION  (rama: dagudelo/production)
  # ─────────────────────────────────────────────
  deploy-prod:
    if: github.ref == 'refs/heads/dagudelo/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Compilar backend PROD
      - name: Compilar Backend PROD
        run: |
          cd backend
          npm install
          npm run build:prod

      # 2. Compilar frontend PROD
      #    Vite incrusta las VITE_* en el bundle en tiempo de compilacion (no
      #    en runtime), y .env.production del frontend esta en .gitignore, asi
      #    que el runner de GitHub no lo tiene — hay que escribirlo desde un
      #    secret antes de compilar, o VITE_API_URL queda undefined.
      - name: Escribir .env.production del frontend
        run: echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > frontend/.env.production

      - name: Compilar Frontend PROD
        run: |
          cd frontend
          npm install
          npm run build

      # 3. Copiar backend compilado al servidor
      #    OJO: la carpeta real en el servidor es WodenTrack_Prd (no WodenTrackV2).
      - name: Copiar Backend dist a servidor PROD
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/dist/*"
          target: "C:/Users/Administrator/Documents/WodenTrack_Prd/dist"
          strip_components: 2

      # 4. Copiar frontend compilado al IIS
      #    OJO: la carpeta real es WodenTrackPrd y los archivos van en la RAÍZ
      #    (index.html/assets junto a web.config), sin subcarpeta "dist".
      - name: Copiar Frontend dist a IIS PROD
        uses: appleboy/scp-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "C:/inetpub/wwwroot/WodenTrackPrd"
          strip_components: 2

      # 5. Verificar esquema de base de datos ANTES de reiniciar el proceso.
      #    Si falta una tabla/columna, este paso termina en error y GitHub
      #    Actions NUNCA ejecuta el paso 6 (reiniciar PM2) — el proceso viejo
      #    sigue corriendo tal cual, y llega un correo de alerta (MAIL_ALERT_TO)
      #    con el detalle de qué falta en la base de datos.
      - name: Verificar esquema de base de datos PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "cd C:\\Users\\Administrator\\Documents\\WodenTrack_Prd;
            $env:NODE_ENV='production';
            node dist\\scripts\\verify-schema.js;
            if ($LASTEXITCODE -ne 0) { exit 1 }"

      # 6. Reiniciar PM2 en el servidor (solo si el paso 5 pasó)
      - name: Reiniciar PM2 PROD
        uses: appleboy/ssh-action@master
        with:
          host: 18.217.246.39
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: >-
            powershell -NoProfile -ExecutionPolicy Bypass -Command
            "$p = pm2 list --no-color 2>&1 | Select-String 'WodenTrackPRD';
            if ($p) { pm2 restart WodenTrackPRD --update-env }
            else { pm2 start C:\\Users\\Administrator\\Documents\\WodenTrack_Prd\\ecosystem.config.js };
            pm2 save"
